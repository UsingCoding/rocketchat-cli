version: 2

project_name: rocketchat-cli

builds:
  - id: rocketchat
    main: .
    binary: rocketchat
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/UsingCoding/rocketchat-cli/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
