version: 2

project_name: rocketchat-cli

builds:
  - id: rocketchat
    main: .
    binary: rocketchat
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/UsingCoding/rocketchat-cli/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - ids: [rocketchat]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
